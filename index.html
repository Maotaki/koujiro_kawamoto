<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>SYSTEM WARNING</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 50px;
        }
        .warning {
            color: #ff0033;
            font-size: 2em;
            font-weight: bold;
        }
        .box {
            border: 2px solid #00ff00;
            padding: 20px;
            margin: 30px auto;
            max-width: 600px;
        }
    </style>
</head>
<body>

    <div class="warning">【緊急事態】サイトが占拠されました</div>
    
    <div class="box">
        <p>はっはっは！このウェブサイトは我々が乗っ取った！</p>
        <p>元に戻したくば、以下の謎を解き明かすのだ……。</p>
    </div>

    <!-- ここに謎や解答入力フォームなどを配置 -->
    <div class="mystery">
        <p>【謎1】〇〇に入る言葉を込めよ……</p>
    </div>

</body>
</html>
